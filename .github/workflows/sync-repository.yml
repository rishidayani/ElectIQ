name: Synchronize repository

on:
  workflow_dispatch:

  # Trigger immediately when this workflow is committed
  push:
    branches:
      - development

  # Temporary testing: every 5 minutes
  
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: full-repository-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'rishidayani/ElectIQ'

    runs-on: ubuntu-latest

    steps:
      - name: Clone source repository
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --bare \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            source.git

      - name: Synchronize target repository
        working-directory: source.git
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_TOKEN}" ]; then
            echo "TARGET_TOKEN secret is missing or empty."
            exit 1
          fi

          git push --prune \
            "https://rishi-dayani:${TARGET_TOKEN}@github.com/rishi-dayani/ElectreIQ.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
