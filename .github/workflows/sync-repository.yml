name: Synchronize repository

on:
  # Allows manual testing from the Actions page
  workflow_dispatch:
  
  schedule:
    - cron: "0 10 12 8 *"

permissions:
  contents: read

concurrency:
  group: full-repository-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'rishidayani/ElectIQ'

    runs-on: ubuntu-latest

    steps:
      - name: Clone source repository
        env:
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --bare \
            "https://x-access-token:${SOURCE_TOKEN}@github.com/rishi-dayani/ElectreIQ.git" \
            source.git

      - name: Synchronize target repository
        working-directory: source.git
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          set -euo pipefail

          git push --prune \
            "https://x-access-token:${TARGET_TOKEN}@github.com/account-b/my-project.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
